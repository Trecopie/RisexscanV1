services:
  - type: web
    name: risexscan
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run lint && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: RISEX_DB_SOFT_LIMIT_BYTES
        value: "700000000"
      # Owner supplies this secret in Render's dashboard at no cost.
      - key: DATABASE_URL
        sync: false
