name: Validate RISExScan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: risexscan
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: risexscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risexscan -d risexscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsx --test src/utils/*.test.ts src/components/*.test.tsx
      - name: Verify zero-cost sampler safely skips without DB secret
        run: env -u DATABASE_URL npx tsx scripts/freeHistorySampler.ts
      - name: Verify PostgreSQL live storage and historical analytics
        env:
          TEST_DATABASE_URL: postgresql://risexscan:local_ci_password@localhost:5432/risexscan_test
        run: npx tsx --test src/utils/historyStore.integration.test.ts
      - run: npm run build
      - name: Smoke-test production Express health and HTML boot
        run: |
          NODE_ENV=production PORT=4307 npm run start > /tmp/risexscan-startup.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4307/api/health | grep -q '"ok":true'; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/risexscan-startup.log
            exit 1
          fi
          curl --fail --silent --output /tmp/risexscan-index.html http://127.0.0.1:4307/
          grep -qi '<!doctype html' /tmp/risexscan-index.html
