name: Independent full Git-history secret scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The default gitleaks-action PR mode scanned only the PR range in the
      # prior workflow (1 commit). Use the CLI explicitly with --all so the
      # check covers ALL locally fetched reachable commits and tags.
      - name: Install pinned Gitleaks CLI from official release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Verify full clone and scan ALL reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          echo "Reachable commits: $(git rev-list --all --count)"
          /tmp/gitleaks detect --source . --redact --log-opts="--all" --exit-code=1 --verbose
          echo "Full reachable Git history scan passed."
