name: Launch browser QA - public RISExScan
# Owner-triggered: real Chromium visual/smoke test of deployed site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://risexscan.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Install ephemeral Chromium test runner
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test live overview, heatmap, theme persistence, routes and mobile overflow
        run: node scripts/liveBrowserSmoke.mjs
      - name: Upload viewport screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risexscan-launch-qa-screenshots
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
